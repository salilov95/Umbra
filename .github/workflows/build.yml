# Runs the tests on Windows for every push, and on a version tag (v0.6.1)
# builds Umbra.exe + the installer and attaches them to a GitHub Release.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write        # needed to create the release

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Tests
        run: python -m unittest discover -s tests -t .

      - name: Build Umbra.exe
        run: |
          python -m pip install --upgrade pip pyinstaller
          python -m PyInstaller --noconfirm --clean --log-level WARN --onefile --windowed --name Umbra --icon "assets\icon.ico" --add-data "umbra\web;umbra\web" launcher.py

      - name: Smoke test of the exe
        shell: pwsh
        run: |
          # the exe must start, restore the proxy and exit with code 0
          $p = Start-Process -FilePath dist\Umbra.exe -ArgumentList "--restore-proxy" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Umbra.exe --restore-proxy exited with $($p.ExitCode)" }

      - name: Build the installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $ver = python -c "import umbra; print(umbra.__version__)"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Qp "/DAppVersion=$ver" installer\Umbra.iss
          Get-FileHash dist\Umbra.exe, dist\Umbra-Setup-$ver.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Set-Content dist\SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: umbra-windows
          path: |
            dist/Umbra.exe
            dist/Umbra-Setup-*.exe
            dist/SHA256SUMS.txt

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Umbra.exe
            dist/Umbra-Setup-*.exe
            dist/SHA256SUMS.txt
